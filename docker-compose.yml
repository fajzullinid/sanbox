services:
  backend:
    image: ${IMAGE_REGISTRY}/fajzullinid-backend-docker/sandbox-backend:${IMAGE_TAG}
    container_name: backend
    ports:
      - "8081:8081"
    networks:
      - sandbox-net
    restart: unless-stopped

  frontend:
    image: ${IMAGE_REGISTRY}/fajzullinid-frontend-docker/sandbox-frontend:${IMAGE_TAG}
    container_name: frontend
    ports:
      - "8888:80"
    depends_on:
      - backend
    networks:
      - sandbox-net
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge