name: Build and Push 

on:
  push:
    branches:
      - lab3

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend 
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
  VERSION: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Чтобы мог пушить в ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Log in ghcr.io 
        uses: docker/login-action@v3
        with: 
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Токен встроен в гитхаб

      # Логин в NEXUS

      - name: Log in NEXUS
        run: echo "${{ secrets.NEXUS_REPO_PASS }}" | docker login ${{ secrets.NEXUS_HOST }} -u ${{ secrets.NEXUS_REPO_USER }} --password-stdin 

      - name: build and push backend 
        uses: docker/build-push-action@v5
        with: 
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true 

          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_BACKEND }}:${{ env.VERSION }}
            ${{ secrets.NEXUS_HOST }}/fajzullinid-backend-docker/sandbox-backend:latest
            ${{ secrets.NEXUS_HOST }}/fajzullinid-backend-docker/sandbox-backend:${{ env.VERSION }}
      

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ env.VERSION }}
            ${{ secrets.NEXUS_HOST }}/fajzullinid-frontend-docker/sandbox-frontend:latest
            ${{ secrets.NEXUS_HOST }}/fajzullinid-frontend-docker/sandbox-frontend:${{ env.VERSION }}