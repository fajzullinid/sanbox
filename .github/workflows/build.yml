name: Build and Push 

on:
  push:
    branches:
      - lab3

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend 
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
  VERSION: ${{ github.run_id }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with: 
          buildkitd-config-inline: |
            [registry."${{ secrets.NEXUS_DOCKER_URL }}"]
              http = true
      
      - name: Log in ghcr.io 
        uses: docker/login-action@v3
        with: 
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Docker for insecure registry (Nexus)
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "insecure-registries" : ["${{ secrets.NEXUS_DOCKER_URL }}"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Log in NEXUS
        run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_DOCKER_URL }} -u ${{ secrets.NEXUS_USER }} --password-stdin 

      - name: Build and push backend 
        uses: docker/build-push-action@v5
        with: 
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true 
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_BACKEND }}:${{ env.VERSION }}
            ${{ secrets.NEXUS_DOCKER_URL }}/fajzullinid-backend-docker/sandbox-backend:latest
            ${{ secrets.NEXUS_DOCKER_URL }}/fajzullinid-backend-docker/sandbox-backend:${{ env.VERSION }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ env.VERSION }}
            ${{ secrets.NEXUS_DOCKER_URL }}/fajzullinid-frontend-docker/sandbox-frontend:latest
            ${{ secrets.NEXUS_DOCKER_URL }}/fajzullinid-frontend-docker/sandbox-frontend:${{ env.VERSION }}