name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия образов (например, 20261119-214623)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Устанавливаем yc CLI
      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      # 2. Настраиваем yc
      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-sa-key.json"

          yc config profile create ci
          yc config set service-account-key "$RUNNER_TEMP/yc-sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"

      # 3. Получаем kubeconfig для кластера
      - name: Get Kubeconfig
        run: |
          # Замени ID кластера на свой!
          yc managed-kubernetes cluster get-credentials --id catlfraot6janr9bu7lv --external --force

      # 4. Проверяем подключение
      - name: Verify Cluster Connection
        run: kubectl cluster-info

      - name: Debug repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Helm charts:"
          find . -name Chart.yaml

      # 5. Устанавливаем Helm
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # 6. Деплой
      - name: Deploy with Helm
        run: |
          helm upgrade --install momo-store ./helm/momo-store \
            --set frontend.image=ghcr.io/fajzullinid/sanbox/frontend:${{ github.event.inputs.VERSION }} \
            --set backend.image=ghcr.io/fajzullinid/sanbox/backend:${{ github.event.inputs.VERSION }} \
            --wait