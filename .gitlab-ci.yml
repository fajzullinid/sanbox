stages:
  - build
  - deploy

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  # ... остальные переменные, если нужны

build-frontend:
  stage: build
  trigger:
    include: /src/frontend/.gitlab-ci.yml  # Путь к файлу фронтенда
    strategy: depend
  only:
    changes:
      - src/frontend/**/*  # Изменения в папке фронтенда

build-backend:
  stage: build
  trigger:
    include: /src/backend/.gitlab-ci.yml   # Путь к файлу бэкенда
    strategy: depend
  only:
    changes:
      - src/backend/**/*   # Изменения в папке бэкенда